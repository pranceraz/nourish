[versions]
agp = "9.5.1"
kotlin = "2.4.21"
compose-bom = "2026.11.01"
activity = "1.13.0"
junit = "4.13.2"
androidx-junit = "1.3.0"
androidx-runner = "1.7.0"

room = "2.8.5"
datastore = "1.3.0"
ksp = "2.3.14"

zxing = "3.5.4"
exif = "1.4.2"

[libraries]
room-testing = { module = "androidx.room:room-testing", version.ref = "room" }
barcode-core = { module = "com.google.zxing:core", version.ref = "zxing" }
exif = { module = "androidx.exifinterface:exifinterface", version.ref = "exif" }
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-animation = { module = "androidx.compose.animation:animation" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-test = { module = "androidx.compose.ui:ui-test-junit4" }
junit = { module = "junit:junit", version.ref = "junit" }
androidx-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-junit" }
androidx-runner = { module = "androidx.test:runner", version.ref = "androidx-runner" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
