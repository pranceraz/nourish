name: Android CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Test draft and private lookup services
        run: |
          python3 -m venv "$RUNNER_TEMP/nourish-venv"
          source "$RUNNER_TEMP/nourish-venv/bin/activate"
          pip install -r server/requirements.txt
          python -m unittest server.test_service
  debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NOURISH_BUILD_ID: ${{ github.sha }}

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5

      - name: Install Android SDK packages
        shell: bash
        run: |
          sdk_root="$RUNNER_TEMP/android-sdk"
          archive="$RUNNER_TEMP/android-command-line-tools.zip"
          curl --fail --location --retry 3 \
            https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip \
            --output "$archive"
          echo "7ec965280a073311c339e571cd5de778b9975026cfcbe79f2b1cdcb1e15317ee  $archive" | sha256sum --check
          mkdir -p "$sdk_root/cmdline-tools"
          unzip -q "$archive" -d "$sdk_root/cmdline-tools"
          mv "$sdk_root/cmdline-tools/cmdline-tools" "$sdk_root/cmdline-tools/19.0"
          sdkmanager="$sdk_root/cmdline-tools/19.0/bin/sdkmanager"
          "$sdkmanager" --sdk_root="$sdk_root" --licenses < <(yes)
          "$sdkmanager" --sdk_root="$sdk_root" --install 'platforms;android-37.2' 'build-tools;37.0.0' 'platform-tools'
          ln -s 19.0 "$sdk_root/cmdline-tools/latest"
          echo "$sdk_root/cmdline-tools/19.0/bin" >> "$GITHUB_PATH"
          echo "$sdk_root/platform-tools" >> "$GITHUB_PATH"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"

      - name: Lint, unit test, and compile both APKs
        run: ./gradlew --continue :app:lintDebug :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Upload debug APK
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: nourish-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload lint and unit test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: android-reports
          path: |
            app/build/reports/lint-results-debug.*
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14

      - name: Enable emulator hardware acceleration
        run: sudo chmod 666 /dev/kvm

      - name: Verify offline diary, input flows, and database upgrade
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 30
          arch: x86_64
          disable-animations: true
          script: bash .github/scripts/test-offline-diary.sh

      - name: Upload diary preview
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: diary-preview
          path: |
            app/build/diary-test.png
            app/build/photo-input-test.png
            app/build/meal-draft-test.png
          if-no-files-found: error
          retention-days: 14
